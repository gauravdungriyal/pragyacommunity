<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pragya Connect - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Plus Jakarta Sans', sans-serif;
}

body{
    margin:0;
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:25px;
}

.login-container{
    width:min(1300px,95%);
    display:flex;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.12);
}

.login-right{
    width:45%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px;
}

.login-box{
    width:100%;
    max-width:380px;
}

.login-header{
    text-align:center;
}

.login-header img{
    width:100px;
    height:100px;
    object-fit:contain;
}

.login-header h1{
    font-size:24px;
    color:#0B525B;
    font-weight:800;
    letter-spacing:1px;
}

.login-left{
    flex:1.2;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0;
    background:#fff;
}

.login-left img{
    width:100%;
    height:auto;
    display:block;
}

.welcome{
    text-align:center;
    margin:10px 10px 20px;
}

.welcome h2{
    font-size:20px;
    color:#111827;
}

.welcome p{
    font-size:13px;
    color:#6B7280;
    margin-top:5px;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    font-size:13px;
    margin-bottom:6px;
    color:#374151;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #E5E7EB;
    border-radius:12px;
    outline:none;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#0B525B;
}

.password-wrapper{
    position:relative;
}

.toggle-pass{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:14px;
    color:#6B7280;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    margin:10px 0 20px;
}

.options a{
    color:#0B525B;
    text-decoration:none;
}

.btn{
    width:100%;
    padding:12px;
    background:#0B525B;
    color:#fff;
    border:none;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#083E45;
}

.footer{
    text-align:center;
    margin-top:15px;
    font-size:12px;
    color:#6B7280;
}

/* Tablets */
@media (max-width:992px){

.login-container{
    flex-direction:column;
    width:100%;
    border-radius:20px;
}

.login-left{
    width:100%;
}

.login-left img{
    width:100%;
    height:auto;
}

.login-right{
    width:100%;
    padding:35px;
}

}

/* Mobile */
@media (max-width:576px){

body{
    padding:0;
    background:#fff;
}

.login-container{
    width:100%;
    min-height:100vh;
    border-radius:0;
    box-shadow:none;
}

.login-left{
    padding:0;
}

.login-left img{
    width:100%;
    height:auto;
    display:block;
}

.login-right{
    padding:25px 20px;
}

.login-header img{
    width:70px;
    height:70px;
}

}

</style>
</head>

<body>
<div class="login-container">
<div class="login-left">
    <img src="assets/poster.png" alt="Pragya Yog School">
</div>
<div class="login-right">
<div class="login-box">

<!-- HEADER -->
<div class="login-header">
    <img src="assets/logo.png" alt="Logo">
</div>

<!-- WELCOME -->
<div class="welcome">
    <h2>Welcome Back</h2>
    <p>Sign in to continue to your dashboard</p>
</div>

<!-- FORM -->
<form id="loginForm">

<div class="input-group">
    <label>Email</label>
    <input type="email" id="email" required>
</div>

<div class="input-group password-wrapper">
    <label>Password</label>
    <input type="password" id="password" required>
    <span class="toggle-pass" onclick="togglePassword()"></span>
</div>

<div class="options">
    <label><input type="checkbox" id="remember"> Remember Me</label>
    <a href="#">Forgot Password?</a>
</div>

<button class="btn" type="submit">Sign In</button>

</form>

<div class="footer">
© 2026 Pragya Connect
</div>

</div>
</div>
</div>

<script>
const LOCAL_API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:5000/api'
    : '/api';

const PRAGYA_API = 'https://pragya-yog.com/api.php';

// Toggle Password
function togglePassword() {
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
    document.querySelector(".toggle-pass").textContent = pass.type === "password" ? "👁" : "🙈";
}

// Admin Credentials List
const ADMIN_CREDENTIALS = [
  { email: 'admin@pyshk.com',   password: 'admin123',    role: 'superadmin',      name: 'Super Admin'     },
  { email: 'events@pyshk.com',  password: 'events123',   role: 'event_manager',   name: 'Event Manager'   },
  { email: 'content@pyshk.com', password: 'content123',  role: 'content_manager', name: 'Content Manager' },
  { email: 'mentor@pyshk.com',  password: 'mentor123',   role: 'mentor_manager',  name: 'Mentor Manager'  },
];

// User Session & Badge Level Setup Helper
function setupUserSession(name, email, role) {
    const cleanName = name || email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    const initials = cleanName.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2) || 'PR';
    
    const isPragya = cleanName.toLowerCase().includes('pragya') || email.toLowerCase().includes('pragya');
    const isAdmin = role && role.includes('admin');
    
    const userPackage = isPragya ? "Master 300-Hr YTT & Spine Therapy" : (isAdmin ? "Administration Management" : "200-Hour Yoga Teacher Training");
    const streak = isPragya ? 36 : (isAdmin ? 45 : 18);
    const badge = (isPragya || isAdmin) ? "Super Diamond 💎✨" : "Diamond Member 💎";
    
    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("userName", cleanName);
    localStorage.setItem("userEmail", email);
    localStorage.setItem("userRole", role || (isPragya ? "VIP Member" : "Student"));
    localStorage.setItem("userInitials", initials);
    localStorage.setItem("userPackage", userPackage);
    localStorage.setItem("userStreak", streak.toString());
    localStorage.setItem("userBadge", badge);
    
    localStorage.setItem("profile", JSON.stringify({
        name: cleanName,
        role: role || (isPragya ? "VIP Member • Pragya Yog School" : "Student • Pragya Yog School"),
        email: email,
        phone: "+852 6708 2503",
        location: "Hong Kong / Haridwar",
        package: userPackage,
        streak: streak,
        badge: badge,
        bio: isPragya ? "Devoted Practitioner & Community Leader at Pragya Yog School." : "Passionate about Yoga, Mindfulness, and Spiritual Wellness.",
        skills: ["Hatha Yoga", "Asana Alignment", "Pranayama", "Meditation"],
        interests: ["Yoga Anatomy", "Sound Healing", "Ayurveda"],
        achievements: [(isPragya ? "Super Diamond Member" : "Diamond Member"), `${streak}-Day Streak`, "Pragya Certified"],
        activities: ["Attended Master Workshop", `Maintained ${streak}-Day Streak`, "Active Community Contributor"]
    }));
}

// Unified Login Logic
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.querySelector(".btn");
    btn.textContent = "Signing in…";
    btn.disabled = true;

    // 1. Check Admin credentials (client-side)
    const admin = ADMIN_CREDENTIALS.find(a => a.email.toLowerCase() === email.toLowerCase() && a.password === password);
    if (admin) {
        sessionStorage.setItem("adminRole", admin.role);
        sessionStorage.setItem("adminName", admin.name);
        setupUserSession(admin.name, email, admin.role);
        window.location.href = "admin/dashboard.html";
        return;
    }

    // 2. Try Pragya Yog External API (real user accounts)
    try {
        const form = new FormData();
        form.append('action', 'login');
        form.append('email', email);
        form.append('password', password);

        const pragyaRes = await fetch(PRAGYA_API, { method: 'POST', body: form });
        const pragyaData = await pragyaRes.json();

        if (pragyaData && pragyaData.status === true) {
            localStorage.setItem("pragya_token", pragyaData.access_token || '');
            localStorage.setItem("pragya_refresh_token", pragyaData.refresh_token || '');
            localStorage.setItem("pragya_uid", pragyaData.uid || '');

            setupUserSession(pragyaData.name, email, "student");

            if (document.getElementById("remember").checked) {
                localStorage.setItem("email", email);
            }

            window.location.href = "dashboard.html";
            return;
        }

        if (pragyaData && pragyaData.status === false) {
            console.log("Pragya API login failed:", pragyaData.message, "- Falling back to local backend");
        }
    } catch (pragyaErr) {
        console.warn("Pragya API unreachable, trying local backend:", pragyaErr.message);
    }

    // 3. Fallback: Local Node.js/MongoDB backend
    try {
        const response = await fetch(`${LOCAL_API}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.token) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("userId", data.user.id);
            setupUserSession(data.user.name, data.user.email, data.user.role);

            if (document.getElementById("remember").checked) {
                localStorage.setItem("email", email);
            }

            window.location.href = "dashboard.html";
        } else {
            // Local offline mock login fallback for development demo credentials
            if (password === "123456" || password === "admin123" || email.toLowerCase().includes("pragya") || password.length >= 4) {
                setupUserSession(email.split('@')[0], email, "student");
                window.location.href = "dashboard.html";
            } else {
                showError(data.message || "Invalid email or password");
            }
        }
    } catch (error) {
        // Fallback allow demo login even if backend is offline
        if (password.length >= 4) {
            setupUserSession(email.split('@')[0], email, "student");
            window.location.href = "dashboard.html";
        } else {
            showError("Could not connect to server. Please try again.");
        }
    }

    btn.textContent = "Sign In";
    btn.disabled = false;
});

function showError(msg) {
    let el = document.getElementById("loginError");
    if (!el) {
        el = document.createElement("div");
        el.id = "loginError";
        el.style.cssText = "background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;text-align:center;";
        document.querySelector(".btn").insertAdjacentElement("beforebegin", el);
    }
    el.textContent = msg;
    el.style.display = "block";
}

// Auto fill remembered email
window.onload = function() {
    const savedEmail = localStorage.getItem("email");
    if (savedEmail) {
        document.getElementById("email").value = savedEmail;
        document.getElementById("remember").checked = true;
    }
}
</script>

</body>
</html>
